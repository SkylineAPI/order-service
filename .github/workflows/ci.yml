name: order-service CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: order-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Optional: set DOCKERHUB_USERNAME / DOCKERHUB_TOKEN repo secrets to push images
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build (and push on main if Docker Hub secrets are configured)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && env.DOCKERHUB_USERNAME != '' }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME || 'local' }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKERHUB_USERNAME || 'local' }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-test:
    # Spins up a throwaway Kubernetes cluster and verifies the manifests deploy cleanly
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: medyagh/setup-minikube@latest
      - name: Build image inside minikube
        run: minikube image build -t order-service:1.0.0 .
      - name: Deploy
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/
          kubectl -n foodexpress rollout status deployment/order-postgres --timeout=180s
          kubectl -n foodexpress rollout status deployment/order-service --timeout=180s
      - name: Smoke test
        run: |
          kubectl -n foodexpress port-forward svc/order-service 8000:8000 &
          sleep 5
          curl -sf http://localhost:8000/health
