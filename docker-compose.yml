# Runs the Order Service and its PostgreSQL as separate containers.
# Start restaurant-service's compose first: it creates the shared "foodexpress-net" network.
services:
  order-postgres:
    image: postgres:16-alpine
    container_name: order-postgres
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: orderuser
      POSTGRES_PASSWORD: orderpass
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks: [foodexpress-net]

  order-service:
    build: .
    image: order-service:1.0.0
    container_name: order-service
    environment:
      DATABASE_URL: postgresql://orderuser:orderpass@order-postgres:5432/orderdb
      RESTAURANT_SERVICE_URL: http://restaurant-service:3000
    ports:
      - "8000:8000"
    depends_on: [order-postgres]
    networks: [foodexpress-net]

volumes:
  pg-data:

networks:
  foodexpress-net:
    external: true
